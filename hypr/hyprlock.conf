# ~/.config/hypr/hyprlock.conf
# Catppuccin Mocha (Blue accent) theme for hyprlock
# Tuned for 1366x768 (14" ThinkPad T480 panel)

$rosewater = rgb(f5e0dc)
$flamingo  = rgb(f2cdcd)
$mauve     = rgb(cba6f7)
$blue      = rgb(89b4fa)
$sapphire  = rgb(74c7ec)
$sky       = rgb(89dceb)
$text      = rgb(cdd6f4)
$subtext0  = rgb(a6adc8)
$overlay0  = rgb(6c7086)
$surface0  = rgb(313244)
$surface1  = rgb(45475a)
$base      = rgb(1e1e2e)
$crust     = rgb(11111b)
$red       = rgb(f38ba8)
$green     = rgb(a6e3a1)

$font = JetBrainsMono Nerd Font

general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- Clock ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 62
    font_family = $font Bold
    position = 0, 110
    halign = center
    valign = center
}

# --- Date ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = $subtext0
    font_size = 15
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

# --- Greeting / username ---
label {
    monitor =
    text = Hi, $USER
    color = $blue
    font_size = 15
    font_family = $font Bold
    position = 0, -105
    halign = center
    valign = center
}

# --- Password input field ---
input-field {
    monitor =
    size = 230, 46
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $blue
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password...</span>
    hide_input = false
    check_color = $sapphire
    fail_color = $red
    fail_text = <span foreground="##f38ba8">Wrong password 󰅙</span>
    capslock_color = $mauve
    position = 0, -55
    halign = center
    valign = center
    rounding = 12
    shadow_passes = 2
}

# --- Small lock icon above input ---
label {
    monitor =
    text = 
    color = $blue
    font_size = 20
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

# --- Battery status (bottom corner) ---
label {
    monitor =
    text = cmd[update:5000] echo "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo '?')% 󰁹"
    color = $subtext0
    font_size = 13
    font_family = $font
    position = 20, 20
    halign = left
    valign = bottom
}
